services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wendu
      POSTGRES_PASSWORD: wendu
      POSTGRES_DB: wendu
    ports:
      - "5432:5432"
    volumes:
      - wendu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wendu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://wendu:wendu@postgres:5432/wendu
      FILES_DIR: /data/files
      PUBLIC_API_URL: /api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wendu_files:/data/files

  web:
    build: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  wendu_pg:
  wendu_files:
